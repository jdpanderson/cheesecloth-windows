name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path . -Recurse
          $results | Format-Table -AutoSize -Wrap | Out-String | Write-Host
          if ($results) { throw "PSScriptAnalyzer found $(@($results).Count) problems" }
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"

  # Reads the pin once, so the other jobs build and package the same commit.
  pin:
    name: Pin
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Until cheesecloth releases attach binaries, the pin names a commit,
      # and CI builds the binary from source. See README.md.
      - name: Read cheesecloth.json
        id: pin
        run: |
          if ! jq -e 'keys == ["commit"]' cheesecloth.json > /dev/null; then
            echo "::error::cheesecloth.json must hold only \"commit\""
            exit 1
          fi
          commit=$(jq -r .commit cheesecloth.json)
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the commit in cheesecloth.json is not a full SHA-1: $commit"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  # Builds cheesecloth.exe at the pinned commit. The tests run in
  # cheesecloth's own CI.
  binary:
    name: Binary (${{ matrix.arch }})
    needs: pin
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jdpanderson/cheesecloth
          ref: ${{ needs.pin.outputs.commit }}
          persist-credentials: false
      - name: Select stable Rust
        run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --release --locked -p cheesecloth
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-exe-${{ matrix.arch }}
          path: target/release/cheesecloth.exe
          if-no-files-found: error

  # Builds the installer from the exe that the binary job built, then
  # installs, upgrades and uninstalls it on the runner. It never runs cargo.
  installer:
    name: Installer (${{ matrix.arch }})
    needs: [pin, binary]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      # The x64 Inno Setup, which also runs on Arm64 Windows 11. To update it,
      # see README.md.
      INNO_SETUP_VERSION: 7.1.0
      INNO_SETUP_SHA256: 0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f
      HAS_WINDOWS_SIGNING: ${{ secrets.WINDOWS_SIGNING_CERT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The README, LICENSE, notices and docs that the installer holds, from
      # the commit that built the exe.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jdpanderson/cheesecloth
          ref: ${{ needs.pin.outputs.commit }}
          path: cheesecloth
          sparse-checkout: docs
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-exe-${{ matrix.arch }}
          path: target/exe
      # The runners have Inno Setup 6, which can't build the installer.
      - name: Install Inno Setup
        run: |
          $tag = 'is-' + $env:INNO_SETUP_VERSION.Replace('.', '_')
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_SETUP_VERSION-x64.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$env:INNO_SETUP_VERSION-x64.exe" -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($hash -ne $env:INNO_SETUP_SHA256) { throw "the Inno Setup installer has SHA-256 $hash" }
          $dir = Join-Path $env:RUNNER_TEMP 'innosetup'
          $process = Start-Process $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- `"/DIR=$dir`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "the Inno Setup installer exited with $($process.ExitCode)" }
          & (Join-Path $dir 'ISCC.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe --version exited with $LASTEXITCODE" }
          Add-Content $env:GITHUB_PATH $dir
      - name: Build installer
        run: ./build.ps1 -Arch ${{ matrix.arch }} -Exe target/exe/cheesecloth.exe -Source cheesecloth
      - name: Check installer
        run: |
          $setup = (Get-Item dist/*-setup.exe).FullName
          ./check.ps1 -Setup $setup -Arch ${{ matrix.arch }} -Exe target/exe/cheesecloth.exe -Source cheesecloth
      # Rebuilds the installer, signed. The secrets are only in this step,
      # which runs after check.ps1 and never runs cargo or our binary. Without
      # the secrets it is skipped, and the installer stays unsigned.
      - name: Sign
        if: env.HAS_WINDOWS_SIGNING == 'true'
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: ./sign.ps1 -Arch ${{ matrix.arch }} -Exe target/exe/cheesecloth.exe -Source cheesecloth
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cheesecloth-windows-${{ matrix.arch }}
          path: dist/*-setup.exe
          if-no-files-found: error
          compression-level: 0
