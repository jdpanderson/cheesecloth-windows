name: CI

on:
  push:
    branches: [main]
    # A package release: v<release>-<revision>. See README.md.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path . -Recurse
          $results | Format-Table -AutoSize -Wrap | Out-String | Write-Host
          if ($results) { throw "PSScriptAnalyzer found $(@($results).Count) problems" }
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

  # Reads the pin once, so the other jobs package the same cheesecloth. For a
  # tag, it also checks that the tag names the pinned release.
  pin:
    name: Pin
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # The cheesecloth ref to take the docs from: the commit, or v<release>.
      ref: ${{ steps.pin.outputs.ref }}
      # Empty for a commit.
      release: ${{ steps.pin.outputs.release }}
      sha256-x64: ${{ steps.pin.outputs.sha256-x64 }}
      sha256-arm64: ${{ steps.pin.outputs.sha256-arm64 }}
      # For a tag: <release>-<revision>.
      package: ${{ steps.pin.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The format is in "Contracts" in cheesecloth's docs/REPOSITORIES.md.
      - name: Read cheesecloth.pin
        id: pin
        shell: python3 -I {0}
        run: |
          import os, re, sys, tomllib

          def fail(message):
              sys.exit(f"::error::{message}")

          # The Rust target of each architecture.
          targets = {"x64": "x86_64-pc-windows-msvc", "arm64": "aarch64-pc-windows-msvc"}

          with open("cheesecloth.pin", "rb") as f:
              pin = tomllib.load(f)
          out = {}
          if "commit" in pin:
              if pin.keys() != {"commit"}:
                  fail(f"a commit pin must hold only commit, not {sorted(pin)}")
              commit = pin["commit"]
              if not isinstance(commit, str) or not re.fullmatch(r"[0-9a-f]{40}", commit):
                  fail(f"the commit in cheesecloth.pin is not a full commit id: {commit!r}")
              out["ref"] = commit
          elif "release" in pin:
              if pin.keys() != {"release", "sha256"}:
                  fail(f"a release pin must hold only release and sha256, not {sorted(pin)}")
              release = pin["release"]
              if not isinstance(release, str) or not re.fullmatch(r"\d+\.\d+\.\d+[0-9A-Za-z.-]*", release):
                  fail(f"the release in cheesecloth.pin is not a version: {release!r}")
              sha256 = pin["sha256"]
              if not isinstance(sha256, dict) or sha256.keys() != set(targets.values()):
                  fail(f"[sha256] must list exactly {sorted(targets.values())}")
              for target, digest in sha256.items():
                  if not isinstance(digest, str) or not re.fullmatch(r"[0-9a-f]{64}", digest):
                      fail(f"the SHA-256 of {target} is not 64 hex digits: {digest!r}")
              out["ref"] = f"v{release}"
              out["release"] = release
              for arch, target in targets.items():
                  out[f"sha256-{arch}"] = sha256[target]
          else:
              fail("cheesecloth.pin must hold a commit or a release")

          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/"):
              tag = ref.removeprefix("refs/tags/")
              if "release" not in out:
                  fail(f"tag {tag}: a package release needs a release in cheesecloth.pin")
              if not re.fullmatch(rf"v{re.escape(out['release'])}-[1-9][0-9]*", tag):
                  fail(f"tag {tag} must be v{out['release']}-<revision>")
              out["package"] = tag.removeprefix("v")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for key, value in out.items():
                  f.write(f"{key}={value}\n")

  # The pinned cheesecloth.exe. A release pin: downloads it from the release
  # and checks it against the pin. A commit pin: builds it at that commit;
  # the tests run in cheesecloth's own CI.
  binary:
    name: Binary (${{ matrix.arch }})
    needs: pin
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Download and check the release binary
        if: needs.pin.outputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.pin.outputs.release }}
          TARGET: ${{ matrix.target }}
          SHA256: ${{ needs.pin.outputs[format('sha256-{0}', matrix.arch)] }}
        run: |
          $asset = "cheesecloth-$env:RELEASE-$env:TARGET.exe"
          gh release download "v$env:RELEASE" -R jdpanderson/cheesecloth -p $asset -D target/download
          if ($LASTEXITCODE -ne 0) { throw "downloading $asset failed" }
          $hash = (Get-FileHash "target/download/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -cne $env:SHA256) { throw "$asset has SHA-256 $hash, but cheesecloth.pin has $env:SHA256" }
          Write-Host "ok: $asset has the SHA-256 in cheesecloth.pin"
          New-Item -ItemType Directory -Force target/release | Out-Null
          Move-Item "target/download/$asset" target/release/cheesecloth.exe
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.pin.outputs.release == ''
        with:
          repository: jdpanderson/cheesecloth
          ref: ${{ needs.pin.outputs.ref }}
          persist-credentials: false
      - name: Select stable Rust
        if: needs.pin.outputs.release == ''
        run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.pin.outputs.release == ''
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        if: needs.pin.outputs.release == ''
        run: cargo build --release --locked -p cheesecloth
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-exe-${{ matrix.arch }}
          path: target/release/cheesecloth.exe
          if-no-files-found: error

  # Checks the tray app's windows, builds the installer from the binary job's
  # exe, then installs, upgrades and uninstalls it on the runner. It never
  # runs cargo.
  installer:
    name: Installer (${{ matrix.arch }})
    needs: [pin, binary]
    # Explicit, because runs-on comes from the matrix.
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The README, LICENSE, notices and docs that the installer holds, from
      # the pinned commit or release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jdpanderson/cheesecloth
          ref: ${{ needs.pin.outputs.ref }}
          path: cheesecloth
          sparse-checkout: docs
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-exe-${{ matrix.arch }}
          path: target/exe
      - uses: ./.github/actions/inno-setup
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Check tray accessibility and scaling
        run: dotnet run --project tests/TrayChecks/TrayChecks.csproj --configuration Release
      - name: Build installer
        run: ./build.ps1 -Arch ${{ matrix.arch }} -Exe target/exe/cheesecloth.exe -Source cheesecloth
      - name: Check installer
        run: |
          $setup = (Get-Item dist/*-setup.exe).FullName
          ./check.ps1 -Setup $setup -Arch ${{ matrix.arch }} -Exe target/exe/cheesecloth.exe -Source cheesecloth
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cheesecloth-windows-${{ matrix.arch }}
          path: dist/*-setup.exe
          if-no-files-found: error
          compression-level: 0

  # Rebuilds the installer, signed, on a fresh runner: the installer job ran
  # our binary as a service, so its runner is not trusted with the key. This
  # job never runs cargo or our binary. The secrets are in the "signing"
  # environment, which only main and v* tags may use. The WINDOWS_SIGNING
  # variable turns it on once the secrets are set.
  sign:
    name: Sign (${{ matrix.arch }})
    needs: [pin, binary, installer]
    if: >-
      vars.WINDOWS_SIGNING == 'true' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    environment: signing
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jdpanderson/cheesecloth
          ref: ${{ needs.pin.outputs.ref }}
          path: cheesecloth
          sparse-checkout: docs
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-exe-${{ matrix.arch }}
          path: target/exe
      # sign.ps1 reads the version from the unsigned installer, so it does not
      # run the binary.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cheesecloth-windows-${{ matrix.arch }}
          path: dist
      - uses: ./.github/actions/inno-setup
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Sign
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: ./sign.ps1 -Arch ${{ matrix.arch }} -Exe target/exe/cheesecloth.exe -Source cheesecloth
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cheesecloth-windows-${{ matrix.arch }}-signed
          path: dist/*-setup.exe
          if-no-files-found: error
          compression-level: 0

  # The signed installer is a rebuild, so it gets the same checks as the
  # unsigned one, on a fresh runner without the secrets.
  check-signed:
    name: Check signed installer (${{ matrix.arch }})
    needs: [pin, binary, sign]
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # check.ps1 builds an upgrade installer, which needs these.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jdpanderson/cheesecloth
          ref: ${{ needs.pin.outputs.ref }}
          path: cheesecloth
          sparse-checkout: docs
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-exe-${{ matrix.arch }}
          path: target/exe
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cheesecloth-windows-${{ matrix.arch }}-signed
          path: dist
      - uses: ./.github/actions/inno-setup
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Check signed installer
        run: |
          $setup = (Get-Item dist/*-setup.exe).FullName
          ./verify.ps1 -File $setup
          ./check.ps1 -Setup $setup -Arch ${{ matrix.arch }} -Exe target/exe/cheesecloth.exe -Source cheesecloth

  # Publishes a package release for a tag v<release>-<revision>, after every
  # check passed. While signing is off, sign and check-signed are skipped and
  # the release is unsigned. While it is on, they must pass, so a failed
  # signing never falls back to an unsigned release.
  release:
    name: Publish release
    needs: [lint, pin, installer, sign, check-signed]
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/v') &&
      needs.lint.result == 'success' && needs.installer.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.sign.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.check-signed.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: cheesecloth-windows-*
      - name: Attach the installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PACKAGE: ${{ needs.pin.outputs.package }}
          RELEASE: ${{ needs.pin.outputs.release }}
          SIGNING: ${{ vars.WINDOWS_SIGNING == 'true' }}
          SIGNED: ${{ needs.check-signed.result == 'success' }}
        run: |
          if [[ "$SIGNING" == true && "$SIGNED" != true ]]; then
            echo "::error::signing is on, but the signed installers were not checked"
            exit 1
          fi
          # Only a plain X.Y.Z release of cheesecloth makes a full release; a
          # suffix such as "pre0" makes a pre-release.
          flags=()
          if [[ ! "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            flags+=(--prerelease)
          fi
          suffix=""
          kind=unsigned
          if [[ "$SIGNED" == true ]]; then
            suffix=-signed
            kind=signed
          fi
          mkdir release
          for arch in x64 arm64; do
            setup=(dist/"cheesecloth-windows-$arch$suffix"/*-setup.exe)
            if [[ ${#setup[@]} -ne 1 || ! -f "${setup[0]}" ]]; then
              echo "::error::expected one installer for $arch, found: ${setup[*]}"
              exit 1
            fi
            cp "${setup[0]}" "release/cheesecloth-$PACKAGE-windows-$arch-setup.exe"
          done
          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release create "$TAG" --verify-tag --title "$PACKAGE" --generate-notes "${flags[@]}" \
            --notes "Windows installers ($kind) for cheesecloth $RELEASE." -- *
