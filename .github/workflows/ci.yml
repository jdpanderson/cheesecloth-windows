name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path . -Recurse
          $results | Format-Table -AutoSize -Wrap | Out-String | Write-Host
          if ($results) { throw "PSScriptAnalyzer found $(@($results).Count) problems" }
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

  # Reads the pin once, so the other jobs build and package the same commit.
  pin:
    name: Pin
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Until cheesecloth releases attach binaries, the pin names a commit,
      # and CI builds the binary from source. See README.md.
      - name: Read cheesecloth.json
        id: pin
        run: |
          if ! jq -e 'keys == ["commit"]' cheesecloth.json > /dev/null; then
            echo "::error::cheesecloth.json must hold only \"commit\""
            exit 1
          fi
          commit=$(jq -r .commit cheesecloth.json)
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the commit in cheesecloth.json is not a full SHA-1: $commit"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  # Builds cheesecloth.exe at the pinned commit. The tests run in
  # cheesecloth's own CI.
  binary:
    name: Binary (${{ matrix.arch }})
    needs: pin
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jdpanderson/cheesecloth
          ref: ${{ needs.pin.outputs.commit }}
          persist-credentials: false
      - name: Select stable Rust
        run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --release --locked -p cheesecloth
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-exe-${{ matrix.arch }}
          path: target/release/cheesecloth.exe
          if-no-files-found: error

  # Builds the installer from the exe that the binary job built, then
  # installs, upgrades and uninstalls it on the runner. It never runs cargo.
  installer:
    name: Installer (${{ matrix.arch }})
    needs: [pin, binary]
    # Explicit, because runs-on comes from the matrix.
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The README, LICENSE, notices and docs that the installer holds, from
      # the commit that built the exe.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jdpanderson/cheesecloth
          ref: ${{ needs.pin.outputs.commit }}
          path: cheesecloth
          sparse-checkout: docs
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-exe-${{ matrix.arch }}
          path: target/exe
      - uses: ./.github/actions/inno-setup
      - name: Build installer
        run: ./build.ps1 -Arch ${{ matrix.arch }} -Exe target/exe/cheesecloth.exe -Source cheesecloth
      - name: Check installer
        run: |
          $setup = (Get-Item dist/*-setup.exe).FullName
          ./check.ps1 -Setup $setup -Arch ${{ matrix.arch }} -Exe target/exe/cheesecloth.exe -Source cheesecloth
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cheesecloth-windows-${{ matrix.arch }}
          path: dist/*-setup.exe
          if-no-files-found: error
          compression-level: 0

  # Rebuilds the installer, signed, on a fresh runner: the installer job ran
  # our binary as a service, so its runner is not trusted with the key. This
  # job never runs cargo or our binary. The secrets are in the "signing"
  # environment, which only main may use. The WINDOWS_SIGNING variable turns
  # it on once the secrets are set.
  sign:
    name: Sign (${{ matrix.arch }})
    needs: [pin, binary, installer]
    if: vars.WINDOWS_SIGNING == 'true' && github.ref == 'refs/heads/main'
    environment: signing
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jdpanderson/cheesecloth
          ref: ${{ needs.pin.outputs.commit }}
          path: cheesecloth
          sparse-checkout: docs
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-exe-${{ matrix.arch }}
          path: target/exe
      # sign.ps1 reads the version from the unsigned installer, so it does not
      # run the binary.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cheesecloth-windows-${{ matrix.arch }}
          path: dist
      - uses: ./.github/actions/inno-setup
      - name: Sign
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: ./sign.ps1 -Arch ${{ matrix.arch }} -Exe target/exe/cheesecloth.exe -Source cheesecloth
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cheesecloth-windows-${{ matrix.arch }}-signed
          path: dist/*-setup.exe
          if-no-files-found: error
          compression-level: 0

  # The signed installer is a rebuild, so it gets the same checks as the
  # unsigned one, on a fresh runner without the secrets.
  check-signed:
    name: Check signed installer (${{ matrix.arch }})
    needs: [pin, binary, sign]
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # check.ps1 builds an upgrade installer, which needs these.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jdpanderson/cheesecloth
          ref: ${{ needs.pin.outputs.commit }}
          path: cheesecloth
          sparse-checkout: docs
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-exe-${{ matrix.arch }}
          path: target/exe
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cheesecloth-windows-${{ matrix.arch }}-signed
          path: dist
      - uses: ./.github/actions/inno-setup
      - name: Check signed installer
        run: |
          $setup = (Get-Item dist/*-setup.exe).FullName
          $status = (Get-AuthenticodeSignature $setup).Status
          if ($status -ne 'Valid') { throw "the signature of $setup is $status" }
          ./check.ps1 -Setup $setup -Arch ${{ matrix.arch }} -Exe target/exe/cheesecloth.exe -Source cheesecloth
